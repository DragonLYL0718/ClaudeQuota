name: QuotaRings
options:
  bundleIdPrefix: com.rayleigh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
# The bundle identifiers keep the app's former name (Claude Quota): logins, settings and the
# shared Application Support folder are tied to them, so renaming them would lose all three.
targets:
  QuotaRings:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: "Quota Rings"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.rayleigh.ClaudeQuota.account
            UTTypeDescription: Quota Rings account
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayleigh.ClaudeQuota
        PRODUCT_NAME: QuotaRings
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: QuotaRingsWidget
        embed: true
  QuotaRingsWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: "Quota Rings"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - "/Library/Application Support/ClaudeQuota/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rayleigh.ClaudeQuota.Widget
        PRODUCT_NAME: QuotaRingsWidget
        SKIP_INSTALL: YES
schemes:
  QuotaRings:
    build:
      targets:
        QuotaRings: all
    run:
      config: Debug
    archive:
      config: Release
